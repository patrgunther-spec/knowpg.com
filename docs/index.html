<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#06100A" />
<title>Golf Swing Coach</title>
<style>
:root{
  --bg:#06100A;--bgT:#0A1A11;--bgB:#03080A;
  --panel:#0F1C13;--panelHi:#16291C;--pBorder:#1F3A2A;
  --fairway:#0BBF4D;--fairwayHi:#19E160;--fairwayDeep:#06703A;
  --gold:#F5C518;--goldHi:#FFE174;--goldDeep:#9C7A05;
  --white:#FFF;--silver:#CDD6CF;--silverDim:#7A8A80;
  --danger:#E63946;--dangerDeep:#7A1620;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(circle at top,var(--bgT),transparent 60%),radial-gradient(circle at bottom,var(--bgB),transparent 60%),var(--bg);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:inherit}
a{color:var(--gold);text-decoration:none}
.container{max-width:720px;margin:0 auto;padding:16px 16px 80px}
.eyebrow{font-size:11px;letter-spacing:3px;font-weight:900;color:var(--gold);text-transform:uppercase}
.title{font-size:34px;font-weight:900;font-style:italic;letter-spacing:1px;text-transform:uppercase;line-height:1.1}
.title .accent{color:var(--fairwayHi)}
.subtitle{font-size:14px;color:var(--silver);line-height:1.5;margin-top:12px}
.frame{border:2px solid var(--gold);background:#02080A;padding:2px;margin-bottom:16px}
.frame-inner{border:1px solid var(--pBorder);background:var(--panel)}
.hero{padding:22px;background:linear-gradient(180deg,#0A2418 0%,#06120C 100%);border:1px solid var(--pBorder)}
.hero-stats{display:flex;margin-top:16px;padding-top:14px;border-top:1px solid var(--pBorder)}

.hero-stat-sep{width:1px;background:var(--pBorder);margin:4px 0}
.btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px;border:2px solid var(--gold);background:linear-gradient(135deg,var(--fairwayHi),var(--fairwayDeep));color:var(--white);font-weight:900;letter-spacing:1.6px;text-transform:uppercase;font-style:italic;font-size:16px;margin-bottom:10px;-webkit-tap-highlight-color:transparent;transition:transform .06s ease,opacity .15s ease}

<body>
<main class="container" id="root"></main>

<script>
/* Golf Swing Coach - single-file standalone build.
 * Calls Google Gemini directly from the browser. The API key is stored only
 * in localStorage. No backend, no servers, no charges. */

const FRAME_LABELS = [
  'Address','Takeaway','Hands At Hip (Back)','Lead Arm Parallel (Back)',
  'Top Of Backswing','Transition','Lead Arm Parallel (Down)','Pre-Impact',
  'Impact','Post-Impact Extension','Mid Follow-Through','Finish'
];
const FRAME_COUNT = 12;
const MOTION_W = 96, MOTION_H = 144;
const MOTION_FPS = 30;
const MIN_SAMPLES = 30, MAX_SAMPLES = 600;
const OUT_MAX = 720;

const SCAN_QUOTES = [
  'Watching the whole clip…','Finding the actual swing…',
  'Skipping practice strokes…','Locking onto impact…'
];
const COACH_QUOTES = [
  'Loading the body-pose model…','Reading your address position…',
  'Measuring your shoulder turn…','Measuring your hip rotation…',
  'Checking your spine angle…','Tracking your head movement…',
  'Reading your weight transfer…','Looking at impact extension…',
  'Spotting strokes you can save…','Drafting your custom drills…',
  'Writing it all down…'
];

/* ===== State ===== */
const state = {
  view: 'home',
  frames: [],
  swing: null,
  videoUrl: null,
  videoDuration: 0,
  progress: 0,
  stage: 'idle',
  error: null,
  report: null,
  quoteIdx: 0,
  pickRange: null,
  showScrubber: false,
  openFrame: null,
};
let quoteTimer = null;

function setState(patch) {
  Object.assign(state, patch);
  render();
}

/* ===== Frame extraction with motion-based swing detection ===== */
function seek(video, t) {
  return new Promise((resolve, reject) => {
    const onSeeked = () => { cleanup(); setTimeout(resolve, 30); };
    const onError = () => { cleanup(); reject(new Error('Could not seek video.')); };
    const cleanup = () => {
      video.removeEventListener('seeked', onSeeked);
      video.removeEventListener('error', onError);
    };
    video.addEventListener('seeked', onSeeked);
    video.addEventListener('error', onError);
    video.currentTime = Math.max(0, t);
  });
}

function movingAverage(arr, w) {
  const half = Math.floor(w / 2);
  const out = new Array(arr.length);
  for (let i = 0; i < arr.length; i++) {
    let s = 0, n = 0;
    for (let k = -half; k <= half; k++) {
      const j = i + k;
      if (j >= 0 && j < arr.length) { s += arr[j]; n++; }
    }
    out[i] = n ? s / n : arr[i];
  }
  return out;
}

async function extractFrames(file, onProgress, onStage) {
  const url = URL.createObjectURL(file);
  const video = document.createElement('video');
  video.src = url;
  video.preload = 'auto';
  video.muted = true;
  video.playsInline = true;
  video.crossOrigin = 'anonymous';

  await new Promise((resolve, reject) => {
    video.addEventListener('loadedmetadata', () => resolve(), { once: true });
    video.addEventListener('error', () => reject(new Error('Could not read video.')), { once: true });
  });
  try { await video.play(); video.pause(); } catch(_){}

  const duration = isFinite(video.duration) && video.duration > 0 ? video.duration : 5;

  if (onStage) onStage('scanning');
  const samples = Math.max(MIN_SAMPLES, Math.min(MAX_SAMPLES, Math.round(duration * MOTION_FPS)));

  const mc = document.createElement('canvas');
  mc.width = MOTION_W; mc.height = MOTION_H;
  const mctx = mc.getContext('2d', { willReadFrequently: true });

  const motionTimes = [], motionScores = [];
  let prevGray = null;

  for (let i = 0; i < samples; i++) {
    const t = (duration * (i + 0.5)) / samples;
    await seek(video, t);
    mctx.drawImage(video, 0, 0, MOTION_W, MOTION_H);
    const data = mctx.getImageData(0, 0, MOTION_W, MOTION_H).data;
    const gray = new Uint8Array(MOTION_W * MOTION_H);
    for (let p = 0, g = 0; p < data.length; p += 4, g++) {
      gray[g] = (data[p]*299 + data[p+1]*587 + data[p+2]*114) / 1000;
    }
    let diff = 0;
    if (prevGray) {
      for (let g = 0; g < gray.length; g++) {
        const d = gray[g] - prevGray[g];
        diff += d < 0 ? -d : d;
      }
    }
    motionTimes.push(t);
    motionScores.push(diff);
    prevGray = gray;
    if (onProgress) onProgress(0.5 * ((i + 1) / samples));
  }

  // ─── Swing detection: peak-spike (impact-shape) ─────────────────────────
  // A golf impact is the SHARPEST moment in the clip: motion ramps up over
  // the backswing, plateaus briefly at the top, ramps up again into impact,
  // peaks for ~1-3 frames (impact = ball strike), then decays.  We find the
  // single sample with the highest "spike score" - the ratio of its motion
  // to the surrounding ~0.5s mean - which corresponds to impact.  This is
  // robust against long bend-over / walking events whose TOTAL motion may
  // exceed the swing's, because those events are sustained (low spike
  // ratio) while impact is a sharp burst (high spike ratio).
  const smoothed = movingAverage(motionScores, 3);

  const spikeRadius = Math.max(8, Math.round(MOTION_FPS * 0.4));
  const overallMax = smoothed.reduce((a, b) => Math.max(a, b), 1);
  const minImpactMotion = overallMax * 0.18; // ignore tiny background spikes

  const impactScore = smoothed.map((v, i) => {
    if (v < minImpactMotion) return 0;
    let sum = 0, n = 0;
    for (let k = -spikeRadius; k <= spikeRadius; k++) {
      const j = i + k;
      if (j >= 0 && j < smoothed.length && j !== i) { sum += smoothed[j]; n++; }
    }
    const surroundMean = n ? (sum / n) : 1;
    const ratio = surroundMean > 0 ? (v / surroundMean) : 1;
    // Score combines raw motion (must be high) with spikiness (must be sharp).
    return v * Math.pow(ratio, 1.5);
  });

  let bestPeakIdx = 0, bestPeakScore = -1;
  for (let i = 1; i < impactScore.length - 1; i++) {
    if (impactScore[i] > bestPeakScore) { bestPeakScore = impactScore[i]; bestPeakIdx = i; }
  }

  // Sanity check: if no spike was found (very low motion clip), fall back
  // to the older sliding-window approach.
  if (bestPeakScore <= 0) {
    const winSamples = Math.max(8, Math.round(MOTION_FPS * 1.8));
    const cum = new Array(smoothed.length + 1).fill(0);
    for (let i = 0; i < smoothed.length; i++) cum[i + 1] = cum[i] + smoothed[i];
    let bs = 0, be = -1;
    for (let s = 0; s + winSamples <= smoothed.length; s++) {
      const en = cum[s + winSamples] - cum[s];
      if (en > be) { be = en; bs = s; }
    }
    bestPeakIdx = bs + Math.round(winSamples * 0.65);
  }

  // Impact happens ~65-70% of the way through the swing window
  // (address takeaway top transition impact = roughly 65% of swing duration).
  // So put the impact frame ~65% from the start of our extracted window.
  const peakTime = motionTimes[bestPeakIdx] ?? duration / 2;
  const TOTAL_WIN = 2.0; // generous swing window
  let startTime = Math.max(0, peakTime - TOTAL_WIN * 0.65);
  let endTime   = Math.min(duration, peakTime + TOTAL_WIN * 0.35);

  // Clamp to reasonable swing length.
  const MIN_WIN = 1.4, MAX_WIN = 2.4;
  let span = endTime - startTime;
  if (span < MIN_WIN) {
    startTime = Math.max(0, peakTime - MIN_WIN * 0.65);
    endTime   = Math.min(duration, startTime + MIN_WIN);
    if (endTime - startTime < MIN_WIN) startTime = Math.max(0, endTime - MIN_WIN);
  } else if (span > MAX_WIN) {
    startTime = Math.max(0, peakTime - MAX_WIN * 0.65);
    endTime   = Math.min(duration, startTime + MAX_WIN);
  }

  if (onStage) onStage('capturing');
  const frames = await sliceFrames(video, startTime, endTime, (p) => {
    if (onProgress) onProgress(0.5 + 0.5 * p);
  });

  return {
    frames,
    swing: { startTime, endTime, peakTime, durationMs: Math.round((endTime - startTime) * 1000) },
    videoUrl: url,
    videoDuration: duration,
  };
}

async function sliceFrames(video, startTime, endTime, onProgress) {
  const w = video.videoWidth || 720;
  const h = video.videoHeight || 1280;
  const scale = Math.min(1, OUT_MAX / Math.max(w, h));
  const cw = Math.max(1, Math.round(w * scale));
  const ch = Math.max(1, Math.round(h * scale));
  const oc = document.createElement('canvas');
  oc.width = cw; oc.height = ch;
  const octx = oc.getContext('2d');
  const frames = [];
  for (let i = 0; i < FRAME_COUNT; i++) {
    const f = (i + 0.5) / FRAME_COUNT;
    const t = startTime + (endTime - startTime) * f;
    await seek(video, t);
    octx.drawImage(video, 0, 0, cw, ch);
    const dataUrl = oc.toDataURL('image/jpeg', 0.78);
    const base64 = dataUrl.split(',')[1] || '';
    frames.push({ data: base64, label: FRAME_LABELS[i], timeMs: Math.round(t*1000), order: i });
    if (onProgress) onProgress((i+1) / FRAME_COUNT);
  }
  return frames;
}

async function extractFramesAtWindow(videoUrl, startTime, endTime, onProgress) {
  const video = document.createElement('video');
  video.src = videoUrl;
  video.preload = 'auto';
  video.muted = true;
  video.playsInline = true;
  video.crossOrigin = 'anonymous';
  await new Promise((resolve, reject) => {
    video.addEventListener('loadedmetadata', () => resolve(), { once: true });
    video.addEventListener('error', () => reject(new Error('Could not read video.')), { once: true });
  });
  try { await video.play(); video.pause(); } catch(_){}
  const frames = await sliceFrames(video, startTime, endTime, onProgress);
  return { frames, swing: { startTime, endTime, peakTime: (startTime+endTime)/2, durationMs: Math.round((endTime-startTime)*1000) } };
}

/* ===== Local AI coach (FREE, runs entirely in your browser) ================
   No API key, no third-party servers, no rate limits, no flaky public APIs.
   Uses TensorFlow.js + MoveNet (a body-pose detection model from Google)
   loaded from a CDN. We detect 17 body keypoints in each of the 12 frames,
   compute real golf-swing metrics from them, and generate the coaching
   report from those measurements with classic golf-instruction rules. */

let _tfReady = null;
let _detector = null;

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if ([...document.scripts].some((s) => s.src === src)) return resolve();
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Could not load ' + src));
    document.head.appendChild(s);
  });
}

async function ensureTf() {
  if (_tfReady) return _tfReady;
  _tfReady = (async () => {
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js');
    if (window.tf?.setBackend) {
      try { await window.tf.setBackend('webgl'); await window.tf.ready(); } catch {}
    }
    _detector = await window.poseDetection.createDetector(
      window.poseDetection.SupportedModels.MoveNet,
      { modelType: window.poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
    );
  })();
  return _tfReady;
}

function loadImage(base64) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('image decode failed'));
    img.src = 'data:image/jpeg;base64,' + base64;
  });
}

async function analyzeFrames(frames) {
  await ensureTf();
  const poses = [];
  for (const f of frames) {
    try {
      const img = await loadImage(f.data);
      const results = await _detector.estimatePoses(img, { flipHorizontal: false });
      poses.push(results[0] || null);
    } catch {
      poses.push(null);
    }
  }
  return buildReportFromPoses(poses, frames);
}

/* ----- Pose math helpers --------------------------------------------- */

function kp(pose, name) {
  if (!pose || !pose.keypoints) return null;
  const k = pose.keypoints.find((p) => p.name === name);
  if (!k || (k.score != null && k.score < 0.3)) return null;
  return k;
}
function dist(a, b) { if (!a || !b) return 0; const dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx*dx + dy*dy); }
function mid(a, b) { if (!a || !b) return null; return { x: (a.x + b.x)/2, y: (a.y + b.y)/2 }; }
function angDeg(a, b) { if (!a || !b) return null; return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI; }
function angAt(a, b, c) { // angle at vertex b between rays b->a and b->c, in degrees
  if (!a || !b || !c) return null;
  const v1 = { x: a.x - b.x, y: a.y - b.y };
  const v2 = { x: c.x - b.x, y: c.y - b.y };
  const dot = v1.x*v2.x + v1.y*v2.y;
  const m1 = Math.sqrt(v1.x*v1.x + v1.y*v1.y);
  const m2 = Math.sqrt(v2.x*v2.x + v2.y*v2.y);
  if (!m1 || !m2) return null;
  const cos = Math.max(-1, Math.min(1, dot / (m1 * m2)));
  return Math.acos(cos) * 180 / Math.PI;
}
function bodyHeight(pose) { // approx pixels from head to ankle
  const nose = kp(pose, 'nose');
  const la = kp(pose, 'left_ankle');
  const ra = kp(pose, 'right_ankle');
  if (!nose) return 0;
  const ankle = la || ra;
  if (!ankle) return 0;
  return Math.abs(ankle.y - nose.y);
}

/* ----- Camera angle and handedness detection -------------------------- */

function detectCameraAngle(addressPose) {
  const ls = kp(addressPose, 'left_shoulder');
  const rs = kp(addressPose, 'right_shoulder');
  const nose = kp(addressPose, 'nose');
  const le = kp(addressPose, 'left_ear');
  const re = kp(addressPose, 'right_ear');
  if (!ls || !rs) return 'unclear';
  const shoulderWidth = Math.abs(rs.x - ls.x);
  const earWidth = (le && re) ? Math.abs(re.x - le.x) : 0;
  const bh = bodyHeight(addressPose) || 1;
  const swRatio = shoulderWidth / bh;
  // Wide shoulders relative to body height = facing the camera (face-on).
  // Narrow shoulders = profile (down-the-line / behind).
  if (swRatio > 0.30) return 'face-on';
  if (swRatio < 0.18) return 'down-the-line';
  return 'unclear';
}

function detectHandedness(addressPose, topPose) {
  // Right-handed golfer: at the top of backswing, the lead (left) arm is
  // higher and the trail (right) arm is lower. We look at which wrist is
  // higher in the frame at the top.
  const lw = kp(topPose, 'left_wrist');
  const rw = kp(topPose, 'right_wrist');
  if (!lw || !rw) return 'right'; // most common default
  return rw.y < lw.y ? 'left' : 'right';
}

/* ----- Metrics ------------------------------------------------------- */

function computeMetrics(poses) {
  const valid = poses.filter(Boolean);
  if (valid.length < 4) return null;

  const address  = poses[0];
  const takeaway = poses[1];
  const top      = poses[4] || poses[3] || poses[5];
  const downHalf = poses[6] || poses[5];
  const impact   = poses[8] || poses[7];
  const postImp  = poses[9] || poses[8];
  const finish   = poses[poses.length - 1];

  const cam    = detectCameraAngle(address);
  const handed = detectHandedness(address, top);
  const bh     = bodyHeight(address) || bodyHeight(top) || bodyHeight(impact) || 200;
  const leadSide  = handed === 'left' ? 'right' : 'left';
  const trailSide = handed === 'left' ? 'left'  : 'right';

  // ─── Helpers used only inside this function ────────────────────────────
  function spineAng(p) {
    const t = mid(kp(p, 'left_shoulder'), kp(p, 'right_shoulder'));
    const b = mid(kp(p, 'left_hip'),      kp(p, 'right_hip'));
    if (!t || !b) return null;
    return Math.atan2(t.x - b.x, b.y - t.y) * 180 / Math.PI;
  }
  function kneeAng(p, side) {
    return angAt(kp(p, side+'_hip'), kp(p, side+'_knee'), kp(p, side+'_ankle'));
  }
  function elbowAng(p, side) {
    return angAt(kp(p, side+'_shoulder'), kp(p, side+'_elbow'), kp(p, side+'_wrist'));
  }
  function shoulderLineAng(p) {
    return angDeg(kp(p, 'left_shoulder'), kp(p, 'right_shoulder'));
  }
  function hipLineAng(p) {
    return angDeg(kp(p, 'left_hip'), kp(p, 'right_hip'));
  }
  function deltaAngle(a, b) {
    if (a == null || b == null) return null;
    return Math.abs(((b - a + 540) % 360) - 180);
  }

  // ─── 1. Head movement RELATIVE to hip midpoint (cancels camera shake) ──
  // The user's head naturally moves with the whole body (camera shake,
  // breathing, the body itself sliding sideways), so we measure how much
  // the head moved RELATIVE to the hip midpoint. That isolates ACTUAL
  // independent head sway / lift / drop, which is what coaching cares about.
  const noseAddr   = kp(address, 'nose');
  const hipMidAddr = mid(kp(address, 'left_hip'), kp(address, 'right_hip'));
  const headRefAddr = (noseAddr && hipMidAddr)
    ? { x: noseAddr.x - hipMidAddr.x, y: noseAddr.y - hipMidAddr.y }
    : null;

  let headRelMaxPx = 0, headAbsMaxPx = 0, headLiftMaxPx = 0;
  for (let i = 0; i < poses.length; i++) {
    const n = kp(poses[i], 'nose');
    const hipMid = mid(kp(poses[i], 'left_hip'), kp(poses[i], 'right_hip'));
    if (!n) continue;
    if (noseAddr) {
      const da = dist(n, noseAddr);
      if (da > headAbsMaxPx) headAbsMaxPx = da;
      // Head LIFT specifically (loss of posture / standing up).
      const lift = noseAddr.y - n.y; // positive = head went UP in frame
      if (lift > headLiftMaxPx) headLiftMaxPx = lift;
    }
    if (hipMid && headRefAddr) {
      const rel = { x: n.x - hipMid.x, y: n.y - hipMid.y };
      const dr = dist(rel, headRefAddr);
      if (dr > headRelMaxPx) headRelMaxPx = dr;
    }
  }
  const headRelPct  = bh ? (headRelMaxPx  / bh) : 0; // body-relative head sway
  const headAbsPct  = bh ? (headAbsMaxPx  / bh) : 0; // raw head displacement
  const headLiftPct = bh ? (headLiftMaxPx / bh) : 0; // lifted up out of posture

  // ─── 2. Shoulder & hip rotation, X-factor ──────────────────────────────
  const shoulderRot = deltaAngle(shoulderLineAng(address), shoulderLineAng(top));
  const hipRot      = deltaAngle(hipLineAng(address),      hipLineAng(top));
  const xFactor     = (shoulderRot != null && hipRot != null) ? Math.max(0, shoulderRot - hipRot) : null;

  // ─── 3. Spine angle change at impact vs address ────────────────────────
  const spA = spineAng(address);
  const spI = spineAng(impact);
  const spineDelta = (spA != null && spI != null) ? Math.abs(spI - spA) : null;

  // ─── 4. Address forward bend (spine tilt from vertical) ────────────────
  const addressSpineTilt = spA != null ? Math.abs(spA) : null;

  // ─── 5. Knee flex changes ──────────────────────────────────────────────
  const kneeAddrTrail = kneeAng(address, trailSide);
  const kneeTopTrail  = kneeAng(top,     trailSide);
  const trailKneeLossAtTop = (kneeAddrTrail != null && kneeTopTrail != null)
    ? (kneeTopTrail - kneeAddrTrail) : null;
  const kneeAddrLead  = kneeAng(address, leadSide);
  const kneeImpLead   = kneeAng(impact,  leadSide);
  const leadKneeStraighteningAtImpact = (kneeAddrLead != null && kneeImpLead != null)
    ? (kneeImpLead - kneeAddrLead) : null;
  const trailKneeImp  = kneeAng(impact,  trailSide);

  // ─── 6. Stance width vs shoulder width ────────────────────────────────
  const stancePx     = dist(kp(address, 'left_ankle'), kp(address, 'right_ankle'));
  const shouldersPx  = dist(kp(address, 'left_shoulder'), kp(address, 'right_shoulder'));
  const stanceVsShoulders = (stancePx && shouldersPx) ? stancePx / shouldersPx : null;

  // ─── 7. Arm metrics ────────────────────────────────────────────────────
  const leadElbowAtImpact   = elbowAng(impact, leadSide);
  const leadElbowAtAddress  = elbowAng(address, leadSide);
  const trailElbowAtTop     = elbowAng(top, trailSide);
  // Lead arm bend at top (should stay close to straight ~170°)
  const leadElbowAtTop      = elbowAng(top, leadSide);

  // ─── 8. Hip slide (lateral hip midpoint movement) ──────────────────────
  // Excessive hip slide instead of rotation is a power leak. We measure
  // the horizontal displacement of the hip midpoint from address to impact
  // (normalized by body height).
  const hipMidImp = mid(kp(impact, 'left_hip'), kp(impact, 'right_hip'));
  let hipSlideAtImpactX = 0;
  if (hipMidAddr && hipMidImp) hipSlideAtImpactX = Math.abs(hipMidImp.x - hipMidAddr.x);
  const hipSlideAtImpactPct = bh ? hipSlideAtImpactX / bh : 0;

  // Hip slide AT TOP (sway off the ball)
  const hipMidTop = mid(kp(top, 'left_hip'), kp(top, 'right_hip'));
  let hipSwayAtTopX = 0;
  if (hipMidAddr && hipMidTop) hipSwayAtTopX = Math.abs(hipMidTop.x - hipMidAddr.x);
  const hipSwayAtTopPct = bh ? hipSwayAtTopX / bh : 0;

  // ─── 9. Shoulder tilt at impact (should be tilted slightly back) ───────
  const shoulderTiltImp = shoulderLineAng(impact);
  const shoulderTiltAddr = shoulderLineAng(address);
  const shoulderTiltDelta = (shoulderTiltImp != null && shoulderTiltAddr != null)
    ? (shoulderTiltImp - shoulderTiltAddr) : null;

  // ─── 10. Finish: hip rotation, balance ─────────────────────────────────
  const finishHipRot = deltaAngle(hipLineAng(address), hipLineAng(finish));
  const finishShoulderRot = deltaAngle(shoulderLineAng(address), shoulderLineAng(finish));
  // Balance check: finish nose x-position vs lead ankle x-position.
  // A balanced finish stacks head over lead foot.
  const noseFinish = kp(finish, 'nose');
  const leadAnkleFinish = kp(finish, leadSide+'_ankle');
  const trailAnkleFinish = kp(finish, trailSide+'_ankle');
  let finishBalancePct = null;
  if (noseFinish && leadAnkleFinish && trailAnkleFinish && bh) {
    const stanceMid = (leadAnkleFinish.x + trailAnkleFinish.x) / 2;
    const ankleSpan = Math.abs(leadAnkleFinish.x - trailAnkleFinish.x) || 1;
    // Negative = nose is over trail foot (bad), Positive = over lead (good)
    finishBalancePct = (noseFinish.x - stanceMid) / (ankleSpan / 2)
      * (leadAnkleFinish.x > stanceMid ? 1 : -1);
  }

  // ─── 11. Address geometry ──────────────────────────────────────────────
  // Hand position vs stance center (proxy for ball position).
  // Positive = hands forward of stance center (good for irons),
  // strongly negative = hands well behind ball (a setup mistake).
  const stanceMidAddrX = mid(kp(address, 'left_ankle'), kp(address, 'right_ankle'))?.x;
  const handMidAddrX   = mid(kp(address, 'left_wrist'), kp(address, 'right_wrist'))?.x;
  const handAtAddrOffsetPct = (stanceMidAddrX != null && handMidAddrX != null && bh)
    ? (handMidAddrX - stanceMidAddrX) / bh : null;

  // Shoulder tilt at address (lead shoulder higher than trail = good).
  // The sign of the tilt depends on camera view; we just measure absolute
  // deviation from horizontal.
  const shoulderTiltAtAddress = (() => {
    const l = kp(address, 'left_shoulder');
    const r = kp(address, 'right_shoulder');
    if (!l || !r) return null;
    return Math.atan2(r.y - l.y, r.x - l.x) * 180 / Math.PI;
  })();
  const shoulderTiltAtAddressMag = shoulderTiltAtAddress != null
    ? Math.abs(shoulderTiltAtAddress) : null;

  // ─── 12. Hand height at top of backswing ──────────────────────────────
  // Above head = hands are too high (lifty, narrow swing).
  // Way below head = flat/short swing.
  const handTopY = mid(kp(top, 'left_wrist'), kp(top, 'right_wrist'))?.y;
  const headTopY = kp(top, 'nose')?.y;
  const handTopRelToHeadPct = (handTopY != null && headTopY != null && bh)
    ? (headTopY - handTopY) / bh : null;
  // positive value means hands are ABOVE head (which is up in screen).

  // ─── 13. Hip openness at impact ───────────────────────────────────────
  const hipImpactRot = deltaAngle(hipLineAng(address), hipLineAng(impact));
  // Pros: ~35-45° open at impact. <20° = stuck, >55° = spinning out.

  // ─── 14. Hand position at impact (forward press through impact) ───────
  const handImpactX     = mid(kp(impact, 'left_wrist'), kp(impact, 'right_wrist'))?.x;
  const ankleImpactMidX = mid(kp(impact, 'left_ankle'), kp(impact, 'right_ankle'))?.x;
  const handAtImpactOffsetPct = (handImpactX != null && ankleImpactMidX != null && bh)
    ? (handImpactX - ankleImpactMidX) / bh : null;

  // ─── 15. Lead arm bend through halfway-down ───────────────────────────
  const leadElbowAtHalfDown = elbowAng(downHalf, leadSide);

  // ─── 16. Spine angle at finish vs address ─────────────────────────────
  // Negative = leaning back from target (good - "reverse C is overdone"),
  // positive = still leaning forward = bad / arms-only swing.
  const spF = spineAng(finish);
  const finishSpineDelta = (spA != null && spF != null) ? (spF - spA) : null;
  const reverseCSeverity = (finishSpineDelta != null && finishSpineDelta < -25)
    ? Math.abs(finishSpineDelta) : null;
  const finishStillBentForward = (finishSpineDelta != null && finishSpineDelta > 10)
    ? finishSpineDelta : null;

  // ─── 17. Trail-leg post-up at finish (kicked / heel up) ───────────────
  const trailKneeFinish = kneeAng(finish, trailSide);

  // ─── 18. Tempo proxy from frame ordering ──────────────────────────────
  // Since we extract 12 evenly-spaced frames across the swing window, the
  // index of the "top of backswing" frame relative to the impact frame
  // tells us the back:down time ratio. We'd expect impact ≈ frame 8 if
  // tempo is 3:1 (top at ≈ frame 5-6). If impact is much later, swing was
  // rushed at top.
  // (This is approximate - real tempo measurement needs the raw motion
  // curve, which extractFrames doesn't currently pass through.)

  // ─── 19. Head reverse-pivot at top ────────────────────────────────────
  // If the head moved TOWARD the target on the backswing, that's a reverse
  // pivot. Direction of "toward target" depends on handedness and camera.
  const noseTop = kp(top, 'nose');
  const headDxAtTop = (noseAddr && noseTop) ? (noseTop.x - noseAddr.x) : 0;
  // Toward target sign: right-handed face-on: target is on the LEFT (x decreases).
  // right-handed down-the-line: target is on the RIGHT (x increases).
  let towardTargetSign;
  if (handed === 'right') towardTargetSign = (cam === 'down-the-line') ? +1 : -1;
  else                    towardTargetSign = (cam === 'down-the-line') ? -1 : +1;
  // Positive value = head moved toward target (bad - reverse pivot).
  const headTowardTargetAtTopPx = headDxAtTop * towardTargetSign;
  const reversePivotPct = bh ? Math.max(0, headTowardTargetAtTopPx / bh) : 0;

  return {
    cameraAngle: cam,
    handedness: handed,
    bodyHeightPx: bh,

    // Head metrics
    headRelPct,                  // body-relative head sway (the one that matters)
    headAbsPct,                  // raw displacement (includes camera shake)
    headLiftPct,                 // head lifted out of posture (early extension look)
    reversePivotPct,             // head moved toward target on backswing

    // Rotation metrics
    shoulderRotDeg: shoulderRot,
    hipRotDeg: hipRot,
    xFactor,
    finishHipRot,
    finishShoulderRot,

    // Posture metrics
    spineDelta,
    addressSpineTilt,
    shoulderTiltDelta,

    // Leg metrics
    trailKneeLossAtTop,
    leadKneeStraighteningAtImpact,
    trailKneeImp,
    stanceVsShoulders,

    // Arm metrics
    leadElbowAtImpact,
    leadElbowAtAddress,
    leadElbowAtTop,
    trailElbowAtTop,

    // Hip slide / sway
    hipSlideAtImpactPct,
    hipSwayAtTopPct,

    // Balance
    finishBalancePct,

    // Address geometry
    handAtAddrOffsetPct,
    shoulderTiltAtAddress,
    shoulderTiltAtAddressMag,

    // Top of backswing
    handTopRelToHeadPct,

    // Impact position
    hipImpactRot,
    handAtImpactOffsetPct,

    // Halfway down
    leadElbowAtHalfDown,

    // Finish
    finishSpineDelta,
    reverseCSeverity,
    finishStillBentForward,
    trailKneeFinish,
  };
}

/* ----- Takeaway generator -------------------------------------------- */

function generateTakeaways(m) {
  const out = [];
  const trail = m.handedness === 'left' ? 'left' : 'right';
  const lead  = m.handedness === 'left' ? 'right' : 'left';

  // ─── 1. Reverse pivot (head moves TOWARD target on backswing) ──────────
  if (m.reversePivotPct > 0.05) {
    const sev = m.reversePivotPct > 0.10 ? 'High' : 'Medium';
    out.push({
      title: 'Stop The Reverse Pivot',
      whatToFix: `At the top of your backswing, your head shifted ~${(m.reversePivotPct*100).toFixed(1)}% of your body height TOWARD the target. That is a reverse pivot - your weight is going the wrong way (forward instead of into the trail leg).`,
      whyItMatters: 'Reverse pivots cause two of the ugliest misses in golf: a huge slice when the body can\'t recover from the wrong weight position, and chunky fat shots when the weight gets stuck on the wrong leg. It also drains every ounce of power.',
      howToFix: `1) Get a soccer ball or basketball. 2) Stand in golf posture with the ball under your ${trail} foot. 3) Take a slow backswing - feel pressure go INTO the ball under that trail foot. 4) Take 15 reps without the ball, feeling weight LOAD into the trail leg on the way back. 5) Add a small foam pad or thin towel under the lead foot for 10 swings - it discourages you from leaning forward.`,
      commonMistakes: ['Sliding sideways instead of loading (rotate, do not sway)', 'Loading too far back and tipping over', 'Forgetting to shift the weight BACK to the lead side on the downswing'],
      reps: '15 ball-under-foot loads + 10 foam-pad swings, 3 times a week',
      estimatedHandicapImpact: sev === 'High' ? 'Save 3-4 strokes per round' : 'Save 1-2 strokes per round',
      priority: sev,
    });
  }

  // ─── 2. Early extension (spine straightens up at impact) ───────────────
  if (m.spineDelta != null && m.spineDelta > 12) {
    const sev = m.spineDelta > 22 ? 'High' : 'Medium';
    out.push({
      title: 'Stop The Early Extension',
      whatToFix: `Your spine angle changed by ${Math.round(m.spineDelta)}° from address to impact. That means you stood up out of your posture (golf-speak: "early extension") - your hips pushed toward the ball.`,
      whyItMatters: 'When you stand up, your hands have to back away from the ball to make room. That causes a slice, blocks (push to the right), and shots hit off the heel of the club. It is one of the biggest consistency killers in amateur golf.',
      howToFix: `1) Stand with your butt against a wall in your golf posture - your butt should TOUCH the wall, not be a fist-width away. 2) Make slow swings keeping your butt in contact with the wall the whole way through. 3) The feel is "sit into your back pocket" through impact. 4) Do 25 slow reps. 5) Take it to the range with a yoga block or hand towel between your ${trail} thigh and the wall (or a chair) - keep it pinned through impact.`,
      commonMistakes: ['Sitting back too far and falling on your heels', 'Locking the knees stiff trying not to extend (stay athletic)', 'Forgetting to rotate - the answer is to rotate AND stay in posture, not to stop turning'],
      reps: '25 wall-butt swings + range session, 3-4 times a week for 3 weeks',
      estimatedHandicapImpact: sev === 'High' ? 'Save 3-5 strokes per round' : 'Save 1-3 strokes per round',
      priority: sev,
    });
  }

  // ─── 3. Hip slide AT IMPACT (lateral instead of rotational) ────────────
  if (m.hipSlideAtImpactPct > 0.07) {
    out.push({
      title: 'Rotate Your Hips, Don\'t Slide Them',
      whatToFix: `Your hips slid sideways ${(m.hipSlideAtImpactPct*100).toFixed(1)}% of your body height toward the target at impact, instead of rotating around your spine. Hips should ROTATE open, not slide.`,
      whyItMatters: 'A hip slide leaves the club face open at impact - pushes and slice-pushes are the classic miss. You also lose power because rotational energy gets converted to lateral motion that doesn\'t go into the ball.',
      howToFix: `1) Push an alignment stick (or a broom) into the ground a few inches outside your lead hip. 2) Take slow swings where your lead hip MUST rotate behind you - if you slide, you hit the stick. 3) Feel your lead hip "go back behind your lead pocket" on the downswing. 4) Do 20 reps in slow motion, then 10 at half speed. 5) Hit balls with the stick still in the ground for 20 swings.`,
      commonMistakes: ['Trying to spin too fast (slow and rotational beats fast and sliding)', 'Lifting the lead heel before rotating', 'Forgetting to keep your trail foot grounded until after impact'],
      reps: '20 slow + 20 half-speed + 20 full swings with stick drill, 3 times a week',
      estimatedHandicapImpact: 'Save 2-3 strokes per round + tighter dispersion',
      priority: m.hipSlideAtImpactPct > 0.12 ? 'High' : 'Medium',
    });
  }

  // ─── 4. Short shoulder turn ────────────────────────────────────────────
  if (m.shoulderRotDeg != null && m.shoulderRotDeg < 75) {
    const sev = m.shoulderRotDeg < 55 ? 'High' : (m.shoulderRotDeg < 65 ? 'Medium' : 'Low');
    out.push({
      title: 'Complete Your Backswing Turn',
      whatToFix: `At the top, your shoulders rotated ${Math.round(m.shoulderRotDeg)}°. A full turn is closer to 85-95° - your back should be pointed at the target, lead shoulder under your chin.`,
      whyItMatters: 'A short shoulder turn means less club-head speed (slower swing = shorter shots, sometimes 20-30 yards off your potential). It also tends to rush your transition, which leads to over-the-top slices and pulls.',
      howToFix: `1) Stand with your back to a wall, feet a few inches away. 2) Cross your arms on your chest. 3) Try to touch the wall with your ${trail} elbow without moving your feet. 4) That is the feeling of a full shoulder turn - shoulders pivot around your spine. 5) Repeat 20 times slowly, then add a club across your chest. 6) Take 10 swings with a 7-iron focusing on COMPLETING the turn before starting down.`,
      commonMistakes: ['Lifting the arms instead of turning the body', 'Sliding the hips backward instead of rotating', 'Rushing from the top - try pausing for half a second to feel a complete turn'],
      reps: '20 wall-touch turns + 10 full swings, 3 times a week',
      estimatedHandicapImpact: 'Save 1-3 strokes per round + pick up 10-20 yards',
      priority: sev,
    });
  }

  // ─── 5. Hip over-turn (no X-factor) ────────────────────────────────────
  if (m.hipRotDeg != null && m.shoulderRotDeg != null
      && m.hipRotDeg > 50 && m.hipRotDeg > m.shoulderRotDeg * 0.65) {
    out.push({
      title: 'Build An X-Factor (Hold Your Hips)',
      whatToFix: `Your hips turned ${Math.round(m.hipRotDeg)}° while your shoulders turned ${Math.round(m.shoulderRotDeg)}°. Pros and big hitters turn their shoulders nearly twice as much as their hips - that gap is called the "X-Factor" and it's where power comes from.`,
      whyItMatters: 'When the hips spin as much as the shoulders, you lose the spring-like wind-up between them. Without the gap, your downswing has no stored energy to unleash - you end up swinging with arms only, losing 20-30 yards.',
      howToFix: `1) Take your normal address. Place a chair (or have a friend stand) just behind your ${trail} hip. 2) Make backswings where your ${trail} hip stays in light contact with the chair the whole way. 3) Feel your shoulders KEEP turning even after the hips have stopped. 4) Do 20 slow backswings. 5) Take 10 full swings with the same feel - hips quiet, shoulders fully wound.`,
      commonMistakes: ['Locking the hip completely (a small turn IS allowed)', 'Letting the trail knee straighten (keep flex)', 'Sliding the hips sideways instead of restricting rotation'],
      reps: '20 chair-restrict swings + 10 full swings, 3-4 times a week',
      estimatedHandicapImpact: 'Save 1-2 strokes per round + add yardage',
      priority: 'Medium',
    });
  }

  // ─── 6. Lead-arm chicken wing ──────────────────────────────────────────
  if (m.leadElbowAtImpact != null && m.leadElbowAtImpact < 155) {
    out.push({
      title: 'Extend Through Impact (Stop The Chicken Wing)',
      whatToFix: `Your lead arm was bent to ${Math.round(m.leadElbowAtImpact)}° at impact. The lead arm should be nearly straight (170-180°) at the moment the club meets the ball. A bent lead arm at impact is the classic "chicken wing".`,
      whyItMatters: 'A chicken wing means you are pulling up and across the ball instead of extending through it. It causes weak slices, low fades, shots that lose distance, and inconsistent strike (sometimes you catch the ball heel-first).',
      howToFix: `1) Fold up a small towel and tuck it under your ${lead} armpit. 2) Make half-swings keeping the towel pinned in place from address through impact. 3) The ${lead} arm should feel like it is REACHING long toward the target after the ball. 4) After 20 reps, drop the towel and hit short pitches with the same feel. 5) Add full swings only after the half-swing feels natural.`,
      commonMistakes: ['Locking the elbow before impact (it stays soft on the way down)', 'Stopping the swing at the ball - keep extending', 'Letting the trail arm overpower the lead'],
      reps: '20 towel half-swings + 10 short pitches, 4 times a week',
      estimatedHandicapImpact: 'Save 1-2 strokes per round',
      priority: m.leadElbowAtImpact < 135 ? 'High' : 'Medium',
    });
  }

  // ─── 7. Trail knee straightens at top (loss of load) ───────────────────
  if (m.trailKneeLossAtTop != null && m.trailKneeLossAtTop > 18) {
    out.push({
      title: 'Keep Your Trail Knee Flexed At The Top',
      whatToFix: `Your ${trail} knee straightened by about ${Math.round(m.trailKneeLossAtTop)}° on the way to the top. The trail knee should stay roughly as flexed as it was at address - that's how you load the trail leg like a coiled spring.`,
      whyItMatters: 'When the trail knee straightens, you stand UP on the backswing and the body lifts away from the ground. That makes you lose the powerful "ground reaction" push you would otherwise get on the downswing - and it is a big reason for inconsistent contact.',
      howToFix: `1) Place a slightly inflated soccer ball or a folded yoga mat under your ${trail} heel. 2) Make slow backswings keeping pressure on that ball. 3) The ${trail} knee should feel like it stays in its socket - flexed and loaded. 4) Do 15 reps. 5) Hit balls feeling like you "sit DOWN into the trail leg" on the way back.`,
      commonMistakes: ['Locking the knee in too tight (athletic flex is the goal, not stiffness)', 'Letting the trail hip slide outward', 'Lifting the trail heel before impact'],
      reps: '15 loaded backswings + 15 range balls, 2-3 times a week',
      estimatedHandicapImpact: 'Save 1-2 strokes per round + better contact',
      priority: 'Medium',
    });
  }

  // ─── 8. Lead arm folded at top ─────────────────────────────────────────
  if (m.leadElbowAtTop != null && m.leadElbowAtTop < 150) {
    out.push({
      title: 'Keep Your Lead Arm Straighter At The Top',
      whatToFix: `Your ${lead} arm was bent to ${Math.round(m.leadElbowAtTop)}° at the top. The lead arm should stay relatively straight (160°+) at the top to keep the swing arc wide. A collapsed lead arm equals a short, narrow swing.`,
      whyItMatters: 'A bent lead arm at the top means a shorter swing arc, which means less club-head speed and shorter shots. It also tends to make the club come down narrow, leading to fat shots and pulls.',
      howToFix: `1) Hold a club out in front of you with just your ${lead} hand. 2) Take slow takeaways feeling your ${lead} arm STAY long and straight. 3) Add the ${trail} hand and do 15 more. 4) On the range, key on "wide takeaway, straight lead arm" until the top. 5) Pause at the top of each swing and feel the lead arm.`,
      commonMistakes: ['Trying to lock the elbow (just keep it straight, not stiff)', 'Letting the wrists hinge too early (delay the hinge to the halfway-back point)', 'Folding the lead arm to get more turn (turn your shoulders more instead)'],
      reps: '15 one-arm + 15 two-arm takeaways, 3 times a week',
      estimatedHandicapImpact: 'Save 1 stroke per round + add yardage',
      priority: 'Low',
    });
  }

  // ─── 9. Incomplete finish ──────────────────────────────────────────────
  if (m.finishHipRot != null && m.finishHipRot < 75) {
    out.push({
      title: 'Finish With Your Hips Facing The Target',
      whatToFix: `At the finish your hips rotated only ${Math.round(m.finishHipRot)}° from address. A full finish has your belt buckle pointing AT the target, balanced on your lead foot, trail toe lightly touching the ground.`,
      whyItMatters: 'An incomplete finish is your body telling itself to slow down THROUGH impact. The body reads "I won\'t finish anyway" as a brake signal and slows the hands, which steals power and accuracy. Pros always rotate to a full balanced finish.',
      howToFix: `1) Take a slow swing and HOLD the finish position for 3 seconds before putting the club down. 2) Check: belt buckle to the target, weight on lead foot, trail toe lightly down. 3) Make 20 of these slow swings, holding each finish. 4) Now do it at full speed. If you can\'t hold the finish for 3 seconds, you\'re off balance.`,
      commonMistakes: ['Falling backward off the lead foot', 'Stopping rotation halfway', 'Lifting up out of the finish posture'],
      reps: '20 slow hold-the-finish swings, every range session',
      estimatedHandicapImpact: 'Save 1-2 strokes per round',
      priority: 'Medium',
    });
  }

  // ─── 10. Off-balance finish (head not over lead foot) ──────────────────
  if (m.finishBalancePct != null && m.finishBalancePct < 0.2) {
    out.push({
      title: 'Stack Your Head Over Your Lead Foot At Finish',
      whatToFix: `At the finish, your head was not stacked over your lead foot - it stayed back. A balanced finish has the head almost directly over the lead foot, weight 90% on that side.`,
      whyItMatters: 'A finish with weight stuck on the back leg means you didn\'t fully transfer to the lead side during the downswing. That causes thin shots, blocks to the right, and inconsistent contact - the dreaded "hanging back" miss.',
      howToFix: `1) Make slow swings and walk through the finish - literally take a small step toward the target after impact. 2) Now make swings WITHOUT walking but with the same feel of pressure moving forward. 3) Hold the finish for 3 seconds with weight pinned on the lead foot. 4) The trail foot should be on its toes lightly.`,
      commonMistakes: ['Pushing off the trail foot too hard (it\'s a passive transfer, not a jump)', 'Sliding the hips instead of rotating', 'Cutting the swing short to avoid losing balance'],
      reps: '20 step-through swings + 20 hold-finish swings, 3 times a week',
      estimatedHandicapImpact: 'Save 1-2 strokes per round',
      priority: 'Medium',
    });
  }

  // ─── 11. Narrow stance ─────────────────────────────────────────────────
  if (m.stanceVsShoulders != null && m.stanceVsShoulders < 0.95) {
    out.push({
      title: 'Widen Your Stance',
      whatToFix: `Your feet were narrower than your shoulders at address (${m.stanceVsShoulders.toFixed(2)}x shoulder width - aim for 1.0-1.1x for irons, 1.1-1.2x for driver).`,
      whyItMatters: 'A narrow stance is a tippy base. You\'ll sway off the ball on the backswing and lose balance at faster speeds. Stability is the foundation of every other improvement.',
      howToFix: '1) Stand tall, arms relaxed. 2) Look down - feet should be roughly under the outside edges of your shoulders. 3) For an iron, exactly shoulder-width. 4) Driver, an inch or two wider. 5) Practice setup in a mirror until it feels normal. 6) Take 10 swings and feel the stability.',
      commonMistakes: ['Going too wide (you can\'t turn)', 'Toes straight forward (flare them 15-20° outward for easier rotation)', 'Forgetting to maintain knee flex'],
      reps: '5 minutes of mirror setup checks daily for 1 week',
      estimatedHandicapImpact: 'Save 1 stroke per round',
      priority: 'Low',
    });
  }

  // ─── 12. Poor address posture (not bent forward enough) ────────────────
  if (m.addressSpineTilt != null && m.addressSpineTilt < 18) {
    out.push({
      title: 'Tilt Forward From The Hips At Address',
      whatToFix: `At address your spine was nearly vertical (${Math.round(m.addressSpineTilt)}° from vertical - we want about 25-35°). You\'re standing too upright.`,
      whyItMatters: 'When you stand too upright, the club has to swing flat and around your body, which is the #1 cause of slices. A proper forward bend lets the club swing on plane and the arms hang naturally.',
      howToFix: '1) Stand tall, club held in front of you at chest height, arms relaxed. 2) Bend forward from the HIPS (not the waist) until the club points at the ground. 3) Let your knees soften slightly. 4) Your butt should feel like it\'s pushed back behind your heels. 5) Practice this setup in a mirror until 25-30° of forward bend feels normal.',
      commonMistakes: ['Bending from the waist instead of the hips (rounded back is bad)', 'Bending the knees too much instead of from the hips', 'Letting the arms reach away from the body - they should hang straight down'],
      reps: '5 minutes daily for a week in front of a mirror',
      estimatedHandicapImpact: 'Save 1-3 strokes per round',
      priority: 'Medium',
    });
  }

  // ─── 13. Hip sway off the ball at top ──────────────────────────────────
  if (m.hipSwayAtTopPct > 0.10) {
    out.push({
      title: 'Rotate Your Hips, Don\'t Sway Off The Ball',
      whatToFix: `On the backswing, your hips moved laterally ${(m.hipSwayAtTopPct*100).toFixed(1)}% of body height AWAY from the target. That\'s a sway, not a rotation. The hips should turn in place.`,
      whyItMatters: 'A hip sway makes it nearly impossible to return to the ball consistently - you\'d have to slide BACK the exact same amount on the downswing. That\'s why swayers get fat shots, thin shots, pushes and pulls all in the same round.',
      howToFix: `1) Set up with a club shaft (or alignment stick) stuck in the ground a few inches outside your ${trail} hip. 2) Take backswings without your hip touching the stick. 3) Feel the hips ROTATE around your spine, not slide. 4) Do 20 slow reps, then 10 at speed.`,
      commonMistakes: ['Locking the lower body completely (some turn is fine, no sliding is the goal)', 'Forgetting to load weight INTO the trail foot (rotation creates the load)', 'Lifting the lead heel up - keep it down'],
      reps: '20 stick-drill backswings + 20 full swings, 3 times a week',
      estimatedHandicapImpact: 'Save 2-3 strokes per round',
      priority: m.hipSwayAtTopPct > 0.16 ? 'High' : 'Medium',
    });
  }

  // ─── 14. Standing up - head LIFTS (different from sway) ────────────────
  if (m.headLiftPct > 0.08) {
    out.push({
      title: 'Keep Your Head At The Same Height',
      whatToFix: `Your head LIFTED ${(m.headLiftPct*100).toFixed(1)}% of your body height during the swing - you stood up out of your posture. This usually happens during the downswing.`,
      whyItMatters: 'When the head lifts, the entire spine straightens - that\'s early extension. The hands have to back away from the ball to make room, causing slices, pushes, and shots hit off the heel.',
      howToFix: `1) Set up under a low ceiling, doorway, or branch where your head is JUST below the obstacle. 2) Take slow swings keeping your head from touching it. 3) Do 20 reps without ever bumping. 4) Move to the range and KEEP the feel - head stays low through impact and only comes up AFTER the ball is gone.`,
      commonMistakes: ['Trying to keep the head frozen (some movement is OK, just not vertical lift)', 'Looking up to see the ball before contact', 'Tensing the neck'],
      reps: '20 doorway-drill swings + range session, 3 times a week',
      estimatedHandicapImpact: 'Save 2-3 strokes per round',
      priority: m.headLiftPct > 0.14 ? 'High' : 'Medium',
    });
  }

  // ─── 15. Body-relative head sway (the OLD one, but stricter threshold) ─
  // Only fires if head moved a lot RELATIVE to the hips. Camera shake and
  // whole-body sliding don't count - this is independent head motion.
  if (m.headRelPct > 0.08) {
    const sev = m.headRelPct > 0.14 ? 'High' : 'Medium';
    out.push({
      title: 'Quiet Your Head Through The Swing',
      whatToFix: `Your head moved ${(m.headRelPct*100).toFixed(1)}% of your body height INDEPENDENTLY of your body (we subtracted out the body\'s own motion). That much independent head movement is too much.`,
      whyItMatters: 'When your head moves on its own (separate from the rest of the body), the bottom of your swing arc moves with it. That means fat shots (ground first), thin shots (top of ball), and a lot of inconsistency.',
      howToFix: '1) Tape a tee to a wall right where your nose is at address. 2) Take slow half-swings without letting the tee move out of view. 3) Now eyes closed for 10 reps. 4) Move outside and pick a single blade of grass next to the ball - don\'t look away from it until your swing is finished. 5) Build up to full speed only after 30 clean reps.',
      commonMistakes: ['Trying to freeze the head completely (some movement is fine)', 'Tensing the neck (stay relaxed)', 'Peeking at the ball before contact'],
      reps: '20 wall-tee swings + 30 grass-blade swings, 4 times a week',
      estimatedHandicapImpact: sev === 'High' ? 'Save 3-4 strokes per round' : 'Save 1-2 strokes per round',
      priority: sev,
    });
  }

  // ─── 16. Trail elbow flying at top ─────────────────────────────────────
  if (m.trailElbowAtTop != null && m.trailElbowAtTop > 110) {
    out.push({
      title: 'Tuck Your Trail Elbow At The Top',
      whatToFix: `Your ${trail} elbow was at ${Math.round(m.trailElbowAtTop)}° at the top - it should be closer to 90°. A "flying" trail elbow means it\'s pointed away from your body instead of down.`,
      whyItMatters: 'A flying trail elbow makes the club travel on a steep, outside path coming down - over-the-top is the classic result. That leads to slices and pulls. A tucked elbow lets the club drop into the slot for a powerful, on-plane downswing.',
      howToFix: `1) Stick a glove under your ${trail} armpit. 2) Take slow backswings keeping the glove pinned. 3) At the top, your ${trail} elbow should point down at the ground, like a waiter holding a tray. 4) Do 15 reps with the glove drill. 5) Add full swings holding the same feel.`,
      commonMistakes: ['Pinning the elbow too tight (it can come off the side a little)', 'Restricting the shoulder turn to keep the elbow tucked - turn fully AND tuck', 'Forgetting the drill once you swing fast'],
      reps: '15 glove-drill swings + 10 full swings, 3 times a week',
      estimatedHandicapImpact: 'Save 1-2 strokes per round',
      priority: 'Medium',
    });
  }

  // ─── 17. Lead knee straightening at impact (different from extension) ──
  if (m.leadKneeStraighteningAtImpact != null && m.leadKneeStraighteningAtImpact > 25) {
    out.push({
      title: 'Post Up On A Slightly Bent Lead Knee',
      whatToFix: `Your ${lead} knee straightened by ${Math.round(m.leadKneeStraighteningAtImpact)}° from address to impact - too much. A small amount of straightening (the "post-up") creates power, but too much is the body jumping out of the shot.`,
      whyItMatters: 'When the lead knee snaps fully straight, the spine often goes with it (early extension). It also throws off your timing - the body is leaving the shot before the club catches up.',
      howToFix: `1) Make slow swings and check that your ${lead} knee still has 10-15° of flex at impact. 2) Feel like the knee "posts" (firms up) but doesn\'t lock straight. 3) Try the "chair drill": sit lightly on a chair set up behind your ${lead} hip and swing keeping contact with the chair through impact.`,
      commonMistakes: ['Keeping the knee TOO flexed (some firming is good, you do need ground force)', 'Standing up instead of rotating', 'Sliding hips forward to "post" instead of rotating'],
      reps: '15 chair-drill swings + 15 range balls, 3 times a week',
      estimatedHandicapImpact: 'Save 1-2 strokes per round',
      priority: 'Medium',
    });
  }

  // ─── 18. Shoulder tilt at impact (should INCREASE from address) ────────
  // Note: hard to detect reliably across camera angles, so only flag if there's
  // a clear loss of tilt (positive tilt change at impact means standing up).
  // We skip if camera angle is unclear - this metric needs face-on or
  // down-the-line for meaningful measurement.

  // ─── 19. Hands behind the ball at address ─────────────────────────────
  if (m.handAtAddrOffsetPct != null && m.handAtAddrOffsetPct < -0.04
      && m.cameraAngle === 'face-on') {
    out.push({
      title: 'Get Your Hands In Front Of The Ball At Address',
      whatToFix: `At address your hands sat ${Math.abs(m.handAtAddrOffsetPct * 100).toFixed(1)}% of your body height BEHIND the stance center. For irons, hands should be slightly ahead of (forward of) the ball - just a few inches.`,
      whyItMatters: 'Hands behind the ball at address pre-loads a flippy, scooping impact - the wrists try to add loft at the last second and you get thin shots, fat shots, and added spin. The setup itself dictates the impact position.',
      howToFix: `1) Set up to a ball as usual. 2) Take your normal grip but settle the hands FORWARD so they sit just ahead of the ball - even a touch ahead of your ${lead} thigh. 3) Check in a mirror that the shaft leans slightly toward the target at address. 4) Practice this static setup 5 minutes a day for a week before adding swings. 5) On the range, start every swing by checking the hand position.`,
      commonMistakes: ['Forcing the hands so far forward you de-loft the club too much', 'Letting the ball position drift forward to compensate', 'Tensing up trying to "set" the hands'],
      reps: '5 minutes daily setup practice for 7 days',
      estimatedHandicapImpact: 'Save 1-2 strokes per round',
      priority: 'Medium',
    });
  }

  // ─── 20. Shoulders too level at address (no tilt) ──────────────────────
  if (m.shoulderTiltAtAddressMag != null && m.shoulderTiltAtAddressMag < 4
      && m.cameraAngle === 'face-on') {
    out.push({
      title: 'Set Your Trail Shoulder Lower At Address',
      whatToFix: `Your shoulder line at address was nearly level (${m.shoulderTiltAtAddressMag.toFixed(1)}° tilt). With a proper grip - trail hand lower on the handle than lead hand - the trail shoulder should naturally sit a touch lower than the lead.`,
      whyItMatters: 'Level shoulders at address usually means you\'re reaching for the ball or aimed across the line. A small tilt toward the trail side pre-sets a proper inside-out swing path and helps you hit slight draws instead of slices.',
      howToFix: `1) Take your normal grip - both hands on the club, ${trail} hand below ${lead} hand. 2) Without changing your hand position, let your ${trail} shoulder DROP by an inch or two. 3) Feel the ${lead} arm and shoulder rise a touch. 4) Look in a mirror - the shoulder line should tilt down toward the ${trail} side. 5) Lock this in over a week of setup practice.`,
      commonMistakes: ['Tilting so much you lean off the ball', 'Bending the spine sideways instead of just dropping the shoulder', 'Letting the trail arm get stiff'],
      reps: '5 minutes daily mirror setup, 7 days',
      estimatedHandicapImpact: 'Save 1 stroke per round + better path',
      priority: 'Low',
    });
  }

  // ─── 21. Hands too high at top (lifty / narrow swing) ─────────────────
  if (m.handTopRelToHeadPct != null && m.handTopRelToHeadPct > 0.20) {
    out.push({
      title: 'Don\'t Lift Your Hands At The Top',
      whatToFix: `At the top, your hands were ${(m.handTopRelToHeadPct * 100).toFixed(1)}% of body height ABOVE your head. The hands should sit roughly at or just above shoulder height - hands over the head means you\'re lifting with the arms instead of turning.`,
      whyItMatters: 'Hands flying high above the head is the classic "lift the arms" backswing. It creates a steep, narrow, over-the-top downswing - the #1 source of slices, pulled hooks, and chunked irons. The body didn\'t turn; the arms did all the work.',
      howToFix: `1) Hold a club across your chest with both arms folded over it. 2) Make a backswing TURN - shoulders rotate, club stays across the chest. That is what a turn-driven backswing feels like. 3) Now hold the club normally, repeat the same TURN feel - your hands will end up at shoulder height, not above. 4) Do 15 chest-club turns + 15 normal swings.`,
      commonMistakes: ['Restricting the shoulder turn (turn fully, just don\'t lift)', 'Tensing the trail arm', 'Reaching for the sky at the top'],
      reps: '15 chest-club + 15 normal swings, 3 times a week',
      estimatedHandicapImpact: 'Save 2-3 strokes per round',
      priority: 'High',
    });
  }

  // ─── 22. Hands too low at top (flat swing) ─────────────────────────────
  if (m.handTopRelToHeadPct != null && m.handTopRelToHeadPct < -0.05
      && m.shoulderRotDeg != null && m.shoulderRotDeg > 60) {
    out.push({
      title: 'Get The Club Up A Little More At The Top',
      whatToFix: `At the top your hands ended up below shoulder/head height. The swing is flat - the club goes around your body more than up. Some flatness is fine but too much creates path issues.`,
      whyItMatters: 'A very flat backswing tends to come into the ball from too far inside, causing hooks, pushes, and a club face that\'s hard to control. Some upward set on the way back gives you more options on the way down.',
      howToFix: `1) Put a chair or low table behind you at hip height. 2) Take a backswing where the club must clear OVER the chair - that forces a bit of vertical set. 3) Do 15 reps. 4) Now without the chair, feel the same "set up over the chair" motion. 5) Stop when hands reach shoulder height roughly.`,
      commonMistakes: ['Going too vertical and losing turn (you still want shoulders rotating ~90°)', 'Lifting with the arms instead of letting them set naturally on plane'],
      reps: '15 chair-clearing swings + 15 normal swings, 2-3 times a week',
      estimatedHandicapImpact: 'Save 1-2 strokes per round',
      priority: 'Medium',
    });
  }

  // ─── 23. Stuck hips at impact (under-rotated) ──────────────────────────
  if (m.hipImpactRot != null && m.hipImpactRot < 20) {
    out.push({
      title: 'Open Your Hips More At Impact',
      whatToFix: `At impact your hips were only ${Math.round(m.hipImpactRot)}° open to the target. Pros are 30-45° open at impact - the lower body is leading the hands through the ball.`,
      whyItMatters: 'Stuck hips at impact means the arms have to do all the work to square the face. That leads to flippy hands, pushes, blocks, and the dreaded hands-ahead-of-body pattern. Hip rotation through impact is THE power source.',
      howToFix: `1) Set up to the ball and place an alignment stick on the ground pointing at the target, just outside your ${lead} foot. 2) Take slow swings feeling your belt buckle ROTATE to point past the stick by impact. 3) Hips should be ~30° open with hands still over the ball. 4) Do 15 slow + 15 half-speed swings. 5) Cue word: "buckle to target".`,
      commonMistakes: ['Sliding hips toward target instead of rotating them open', 'Trying to over-rotate so fast you lose balance', 'Forgetting the trail foot - it should be coming up on the toe by impact'],
      reps: '30 belt-buckle-rotation swings per range session',
      estimatedHandicapImpact: 'Save 2-3 strokes per round + add yardage',
      priority: 'High',
    });
  }

  // ─── 24. Spun-out hips at impact (over-rotated) ────────────────────────
  if (m.hipImpactRot != null && m.hipImpactRot > 55) {
    out.push({
      title: 'Quiet The Hips A Touch Through Impact',
      whatToFix: `At impact your hips were already ${Math.round(m.hipImpactRot)}° open. That\'s spinning out - the hips have raced ahead of the arms and the club gets left behind. Pros are typically 30-45° at impact.`,
      whyItMatters: 'Spinning out gets the body too open too early, which forces the arms to "save" the shot. The result is blocks, pushes, and weak slices because the face is open at impact. The hips should LEAD, not LEAVE the arms.',
      howToFix: `1) Practice swings with your trail foot stepped slightly back. 2) Feel the lower body resist a bit - the chest catches up. 3) Use the cue "let the arms catch up" on the downswing. 4) Do 15 step-back swings, then 15 normal swings staying patient on the downswing.`,
      commonMistakes: ['Stopping the hips entirely (they should still rotate, just not race)', 'Decelerating arms instead of letting body wait', 'Steering the ball'],
      reps: '15 step-back + 15 patient swings, 2-3 times a week',
      estimatedHandicapImpact: 'Save 1-2 strokes per round',
      priority: 'Medium',
    });
  }

  // ─── 25. Hands flipping behind ball at impact ──────────────────────────
  if (m.handAtImpactOffsetPct != null && m.handAtImpactOffsetPct < -0.03
      && m.cameraAngle === 'face-on') {
    out.push({
      title: 'Get Your Hands In Front Of The Ball At Impact',
      whatToFix: `At impact your hands were BEHIND the stance center (${Math.abs(m.handAtImpactOffsetPct * 100).toFixed(1)}% body height behind). The hands should be AHEAD of the ball at impact for an iron - that\'s "forward shaft lean".`,
      whyItMatters: 'Hands behind the ball at impact means you\'re flipping the club through impact, adding loft and spin, and losing distance. The leading edge of the club gets to the ball before the bottom of the club - that\'s a thin shot or a chunked fat shot waiting to happen.',
      howToFix: `1) Place a ball on the ground. Put a tee in the ground 2 inches IN FRONT of the ball (toward the target). 2) Practice taking divots that START at the tee, not behind it. 3) That forces forward shaft lean at impact. 4) Do 10 small chip-style shots with this drill. 5) Build up to full swings keeping the same feel: hands lead, head behind ball.`,
      commonMistakes: ['Adding too much hand-action trying to "press" forward (it\'s a body-rotation move, not a hand move)', 'Hitting down too steeply', 'Stopping the body to "let" the hands lead'],
      reps: '10 tee-in-front pitches per range session for 3 weeks',
      estimatedHandicapImpact: 'Save 2-4 strokes per round',
      priority: 'High',
    });
  }

  // ─── 26. Lead arm collapsing through halfway-down ──────────────────────
  if (m.leadElbowAtHalfDown != null && m.leadElbowAtHalfDown < 140) {
    out.push({
      title: 'Keep Your Lead Arm Wide Through Halfway-Down',
      whatToFix: `Coming down through halfway (frame 7-ish), your ${lead} arm was bent to ${Math.round(m.leadElbowAtHalfDown)}°. That early collapse means the swing arc is shrinking before impact - power leak.`,
      whyItMatters: 'A lead arm that folds on the way down loses the width you built in the backswing. You end up swinging "short and narrow" instead of "long and wide", which costs speed and contact quality.',

  // ─── 28. Trail leg not kicked at finish (stuck in flex) ───────────────

  // ─── 29-100: Wide pool of finer-grained coaching prescriptions ────────

/* ----- Frame breakdown text ----------------------------------------- */

function frameBreakdownFromPoses(poses) {
  const labels = FRAME_LABELS;
  return labels.map((label, i) => {
    const p = poses[i];
    if (!p) {
      return {
        label,
        whatISee: 'Could not get a clear read on your body in this frame. Try better lighting or a closer camera position next time.',
        tip: 'Keep your whole body in the frame so the coach can see every part of your swing.',
      };
    }
    return frameDescription(label, p, i, poses);
  });
}

function frameDescription(label, pose, idx, allPoses) {
  const sa = angDeg(kp(pose, 'left_shoulder'), kp(pose, 'right_shoulder'));
  const ha = angDeg(kp(pose, 'left_hip'), kp(pose, 'right_hip'));
  const sa0 = allPoses[0] ? angDeg(kp(allPoses[0], 'left_shoulder'), kp(allPoses[0], 'right_shoulder')) : null;
  const ha0 = allPoses[0] ? angDeg(kp(allPoses[0], 'left_hip'),       kp(allPoses[0], 'right_hip'))      : null;
  const sRot = (sa != null && sa0 != null) ? Math.round(Math.abs(((sa - sa0 + 540) % 360) - 180)) : null;
  const hRot = (ha != null && ha0 != null) ? Math.round(Math.abs(((ha - ha0 + 540) % 360) - 180)) : null;

  const noseHere = kp(pose, 'nose');
  const noseAddr = kp(allPoses[0], 'nose');
  const headDx = (noseHere && noseAddr) ? Math.round(noseHere.x - noseAddr.x) : 0;
  const headDy = (noseHere && noseAddr) ? Math.round(noseHere.y - noseAddr.y) : 0;

  const tips = {
    'Address': 'Set your feet shoulder-width, slight knee bend, hands hanging just below your shoulders, eyes on the ball.',
    'Takeaway': 'Move the club back with your shoulders and chest - the hands and arms stay quiet.',
    'Hands At Hip (Back)': 'The clubhead should be just outside your hands and pointing at the sky - check this in a mirror.',
    'Lead Arm Parallel (Back)': 'Lead arm parallel to the ground, club roughly perpendicular to it - this is the half-back checkpoint.',
    'Top Of Backswing': 'Back facing the target, lead shoulder under your chin, weight loaded into your trail heel.',
    'Transition': 'Shift pressure into the lead foot first, BEFORE your hands start coming down. Lower body leads.',
    'Lead Arm Parallel (Down)': 'Hands should be in front of your trail thigh now, clubhead behind the hands - that is "lag".',
    'Pre-Impact': 'Hips already starting to face the target, hands ahead of the ball, lead wrist flat.',
    'Impact': 'Hands AHEAD of the ball, lead arm straight, head behind the ball, weight 70% on the lead foot.',
    'Post-Impact Extension': 'Both arms long and reaching toward the target - the moment of full extension.',
    'Mid Follow-Through': 'Trail shoulder pointing under the chin, club coming up over the lead shoulder.',
    'Finish': 'Belt buckle to the target, weight fully on the lead foot, balanced - hold it for 3 seconds.',
  };

  let what = '';
  if (label === 'Address') {
    what = `Setup looks ${pose ? 'reasonable' : 'unclear'}. Shoulders are squared up, you have the basic athletic position.`;
  } else if (label === 'Top Of Backswing') {
    what = `Shoulders rotated ~${sRot ?? '?'}° from address, hips ~${hRot ?? '?'}°. ${sRot != null && sRot < 80 ? 'Backswing is a touch short - work on completing the turn.' : 'Solid amount of turn.'}`;
  } else if (label === 'Impact') {
    what = `At impact your shoulders have rotated back ~${sRot ?? '?'}° toward the target. ${headDx === 0 && headDy === 0 ? '' : `Head is ${Math.abs(headDx)} pixels ${headDx > 0 ? 'forward' : 'back'} of address.`}`;
  } else if (label === 'Finish') {
    what = `Hips rotated ${hRot ?? '?'}° at finish. ${hRot != null && hRot < 80 ? 'Finish is incomplete - keep rotating until your belt buckle faces the target.' : 'Nice complete finish position.'}`;
  } else {
    what = `Shoulders ~${sRot ?? '?'}° turned, hips ~${hRot ?? '?'}° turned at this checkpoint.`;
  }

  return { label, whatISee: what, tip: tips[label] || '' };
}

/* ----- Build the full report ----------------------------------------- */

function buildReportFromPoses(poses, frames) {
  const m = computeMetrics(poses);
  if (!m) {
    return {
      playerHandle: 'The Player',
      cameraAngle: 'unclear',
      handedness: 'right',
      summary: 'We could not get a clear read on your body in enough frames. Make sure your whole body (head to feet) is visible in the camera, with bright even lighting and not too much zoom.',
      oneThingYouDidWell: 'You took the swing - that is the first step. Now we need a cleaner film.',
      ballFlightExplanation: 'We need a clearer view of your body to predict ball flight.',
      frameBreakdown: FRAME_LABELS.map((label, i) => ({
        label,
        whatISee: 'Body not clearly visible.',
        tip: 'Frame the camera so we can see head to feet, side or face-on.',
      })),
      takeaways: [{
        title: 'Re-Film Your Swing With Better Framing',
        whatToFix: 'The body could not be detected reliably in your video.',
        whyItMatters: 'Without a clear view of your shoulders, hips, knees and arms, no coach (human or AI) can give you accurate fixes.',
        howToFix: '1) Stand the camera 8-10 feet away. 2) Show your whole body, head to feet. 3) Bright daylight or even indoor light - avoid backlighting. 4) Hold the camera steady (a tripod or a friend). 5) Frame from the side (down-the-line) for the best swing-plane view.',
        commonMistakes: ['Camera too close (cuts off feet)', 'Camera too far (body too small)', 'Backlighting (golfer is silhouetted)'],
        reps: 'Just one good clip',
        estimatedHandicapImpact: 'Setup for everything else',
        priority: 'High',
      }],
      practicePlan: { summary: 'Re-film your swing first, then come back.', weeklySchedule: [] },
      nextVideoTip: 'Stand 8-10 feet from the camera, side-view, bright light, head to feet visible.',
    };
  }

  const handles = ['The Architect', 'Smooth Operator', 'Big Hitter', 'The Tactician', 'Iron Man', 'The Crusher', 'Steady Hands', 'Power Move'];
  const handle = handles[Math.floor((frames[0]?.timeMs || 0) / 100) % handles.length];

  const takeaways = generateTakeaways(m);
  const frameBreakdown = frameBreakdownFromPoses(poses);

  // Summary built from headline metrics
  const summaryBits = [];
  if (m.shoulderRotDeg != null) summaryBits.push(`shoulder turn of ${Math.round(m.shoulderRotDeg)}°`);
  if (m.hipRotDeg != null) summaryBits.push(`hip turn of ${Math.round(m.hipRotDeg)}°`);
  if (m.headRelPct != null) summaryBits.push(`independent head movement of ${(m.headRelPct*100).toFixed(1)}% body height`);
  const summary = `Your swing showed a ${summaryBits.join(', ')}. ${
    takeaways.filter(t => t.priority === 'High').length > 0
      ? 'There are a couple of high-priority fixes that will pay off the fastest.'
      : 'The fundamentals are mostly there - the takeaways below will tighten the small stuff.'
  }`;

  // Pick a positive
  let positive = 'You took a committed swing - that is half the battle.';
  if (m.finishHipRot != null && m.finishHipRot >= 75) positive = `You rotated your hips ${Math.round(m.finishHipRot)}° to a nice complete finish at Frame 12.`;
  else if (m.shoulderRotDeg != null && m.shoulderRotDeg >= 80) positive = `You completed a full ${Math.round(m.shoulderRotDeg)}° shoulder turn at the top (Frame 5) - that is solid power potential.`;
  else if (m.headRelPct != null && m.headRelPct < 0.05) positive = `Your head stayed remarkably steady through the swing (only ${(m.headRelPct*100).toFixed(1)}% of body height of independent movement). That is a great foundation.`;

  // Ball-flight forecast based on metrics
  let ballFlight = 'Based on what we see: ';
  const shots = [];
  if (m.spineDelta != null && m.spineDelta > 14) shots.push('thin / topped shots and pushes when your body stands up at impact');
  if (m.leadElbowAtImpact != null && m.leadElbowAtImpact < 150) shots.push('weak slices and pull-cuts from the chicken wing');
  if (m.reversePivotPct > 0.05) shots.push('pulls and high-spin shots from the reverse pivot');
  if (m.hipSlideAtImpactPct > 0.08) shots.push('pushes and weak right-misses from the hip slide');
  if (m.headLiftPct > 0.08) shots.push('thin shots and topped balls when you stand up at impact');
  if (m.shoulderRotDeg != null && m.shoulderRotDeg < 60) shots.push('a loss of distance from the short backswing');
  if (m.hipRotDeg != null && m.shoulderRotDeg != null && m.hipRotDeg > m.shoulderRotDeg * 0.7) shots.push('an inconsistent strike pattern from the over-rotated hips');
  if (shots.length === 0) ballFlight = 'Your swing pattern looks fairly clean. The most likely miss is a small directional inconsistency that will tighten up with the drills below.';
  else ballFlight += shots.join('; ') + '. The takeaways below knock those out.';

  // Practice plan combining the top drills
  const top = takeaways.slice(0, 3);
  const days = ['Monday', 'Wednesday', 'Friday', 'Saturday'];
  const practicePlan = {
    summary: 'Spend three short sessions a week working the top drills, plus one longer range session. Slow reps beat fast reps - golf is a habits game.',
    weeklySchedule: top.length ? top.map((t, i) => ({
      day: days[i] || days[0],
      focus: t.title + ' drill',
      minutes: 15,
    })).concat({
      day: 'Saturday',
      focus: 'Range session: combine the top drills + 30 full swings',
      minutes: 30,
    }) : [],
  };

  return {
    playerHandle: handle,
    cameraAngle: m.cameraAngle,
    handedness: m.handedness,
    summary,
    oneThingYouDidWell: positive,
    ballFlightExplanation: ballFlight,
    frameBreakdown,
    takeaways,
    practicePlan,
    nextVideoTip: m.cameraAngle === 'unclear'
      ? 'Try filming from the side (down-the-line) for the cleanest swing-plane view.'
      : 'For the next video, try a different angle - if you filmed face-on, try down-the-line. We can spot different things from each view.',
  };
}

// source: 'library' = open Photos picker (no `capture` attribute, so iOS
// shows the standard sheet starting with the Photo Library).

function pickFile(source) {
  const id = source === 'camera' ? 'fileInputCamera' : 'fileInputLibrary';
  const i = document.getElementById(id);

}

async function onFile(file) {
  if (!file) return;
  if (state.videoUrl) { try { URL.revokeObjectURL(state.videoUrl); } catch(_){} }
  setState({ view: 'analyze', stage: 'scanning', progress: 0, frames: [], swing: null, error: null, report: null, quoteIdx: 0 });
  startQuoteTimer();
  try {
    const r = await extractFrames(
      file,
      (p) => setState({ progress: p }),
      (s) => setState({ stage: s })
    );
    stopQuoteTimer();
    setState({
      frames: r.frames, swing: r.swing,
      videoUrl: r.videoUrl, videoDuration: r.videoDuration,
      stage: 'idle', view: 'review',
      pickRange: { start: r.swing.startTime, end: r.swing.endTime },
      showScrubber: false,
    });
  } catch (e) {
    stopQuoteTimer();
    setState({ stage: 'error', error: e.message || String(e) });
  }
}

async function runAnalysis(frames) {
  setState({ view: 'analyze', stage: 'analyzing', progress: 1, error: null, quoteIdx: 0 });
  startQuoteTimer();
  try {
    const report = await analyzeFrames(frames);
    stopQuoteTimer();
    setState({ report, stage: 'idle', view: 'results', openFrame: null });
  } catch (e) {
    stopQuoteTimer();
    setState({ stage: 'error', error: e.message || String(e) });
  }
}

async function rePick(start, end) {
  if (!state.videoUrl) return;
  setState({ view: 'analyze', stage: 'capturing', progress: 0, error: null });
  try {
    const r = await extractFramesAtWindow(state.videoUrl, start, end, (p) => setState({ progress: p }));
    setState({ frames: r.frames, swing: r.swing });
    await runAnalysis(r.frames);
  } catch (e) {
    setState({ stage: 'error', error: e.message || String(e) });
  }
}

function reset() {
  if (state.videoUrl) { try { URL.revokeObjectURL(state.videoUrl); } catch(_){} }
  setState({
    view: 'home', frames: [], swing: null, videoUrl: null, videoDuration: 0,
    progress: 0, stage: 'idle', error: null, report: null, quoteIdx: 0,
    pickRange: null, showScrubber: false, openFrame: null,

function startQuoteTimer() {
  stopQuoteTimer();
  quoteTimer = setInterval(() => setState({ quoteIdx: (state.quoteIdx || 0) + 1 }), 1800);
}
function stopQuoteTimer() {
  if (quoteTimer) { clearInterval(quoteTimer); quoteTimer = null; }
}

/* ===== Renderers ===== */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function priorityTone(p) {
  const v = String(p || '').toLowerCase();
  if (v === 'high') return 'var(--danger)';
  if (v === 'medium') return 'var(--gold)';
  return 'var(--fairwayHi)';
}
function fmtTime(t) {
  const m = Math.floor(t / 60);
  const s = (t - m * 60).toFixed(1);
  return `${m}:${s.padStart(4,'0')}`;
}

// User scrubs the native video player to the moment of swing start (or
// finish), then taps the corresponding button. We snap the picked window
// boundary to the video's current playback time.
function markPickHere(which) {
  const v = document.getElementById('scrubVideo');
  if (!v) return;
  const t = Math.max(0, Math.min(state.videoDuration, Number(v.currentTime) || 0));
  let { start, end } = state.pickRange || { start: 0, end: Math.min(2, state.videoDuration) };

  if (which === 'start') {
    start = t;
    if (end <= start) end = Math.min(state.videoDuration, start + 1.5);
  } else {
    end = t;
    if (start >= end) start = Math.max(0, end - 1.5);
  }
  // Clamp to a sensible 0.6s..4.0s window length.
  const minWin = 0.6;
  const maxWin = Math.min(4.0, state.videoDuration);
  const span = end - start;
  if (span < minWin) {
    if (which === 'start') end = Math.min(state.videoDuration, start + minWin);
    else start = Math.max(0, end - minWin);
  }
  if (span > maxWin) {
    if (which === 'start') end = start + maxWin;
    else start = end - maxWin;
  }
  state.pickRange = { start, end };

  // Live-update the labels without a full re-render so the video keeps playing.
  const ls = document.getElementById('lblStart');
  const lw = document.getElementById('lblWindow');
  const le = document.getElementById('lblEnd');
  if (ls) ls.textContent = `START · ${fmtTime(start)}`;
  if (lw) lw.textContent = fmtTime(end - start);
  if (le) le.textContent = `END · ${fmtTime(end)}`;
}
function previewWindow() {
  const v = document.getElementById('scrubVideo');
  if (!v) return;
  const { start, end } = state.pickRange;
  v.currentTime = start;
  v.play().catch(()=>{});
  const stopAt = () => {
    if (v.currentTime >= end) { v.pause(); v.removeEventListener('timeupdate', stopAt); }
  };
  v.addEventListener('timeupdate', stopAt);
}

        </div>` : ''}
      <div class="meta-row">
        <div class="meta-chip" style="background:#0A2418;border-color:var(--fairwayDeep)">
          <div class="meta-chip-label" style="color:var(--fairwayHi)">⏱  DO IT</div>
          <div class="meta-chip-text">${esc(t.reps)}</div>
        </div>
        <div class="meta-chip" style="background:#1A1300;border-color:var(--goldDeep)">
          <div class="meta-chip-label" style="color:var(--gold)">📉  HANDICAP IMPACT</div>
          <div class="meta-chip-text">${esc(t.estimatedHandicapImpact)}</div>
        </div>
      </div>
    </div>
  </div>`;
}

function render() {
  const root = document.getElementById('root');
  let html = '';
  if (state.view === 'home') html = viewHome();
  else if (state.view === 'review') html = viewReview();
  else if (state.view === 'analyze') html = viewAnalyze();
  else if (state.view === 'results') html = viewResults();
  else html = viewHome();
  root.innerHTML = `
    <input id="fileInputLibrary" type="file" accept="video/*" style="display:none" onchange="onFile(this.files && this.files[0])" />
    <input id="fileInputCamera" type="file" accept="video/*" capture="environment" style="display:none" onchange="onFile(this.files && this.files[0])" />
    ${html}`;
}

window.addEventListener('DOMContentLoaded', () => {
  render();
  // Warm up TensorFlow + MoveNet in the background so the first analysis
  // doesn't have to wait for the ~4MB model to download.
  setTimeout(() => { ensureTf().catch(() => {}); }, 800);
});
window.pickFile = pickFile;
window.onFile = onFile;
window.runAnalysis = runAnalysis;
window.rePick = rePick;
window.reset = reset;
window.setState = setState;
window.toggleScrubber = toggleScrubber;
window.markPickHere = markPickHere;
window.previewWindow = previewWindow;
window.toggleBrd = toggleBrd;
window.state = state;
</script>
</body>
</html>
